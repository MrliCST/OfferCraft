# 测试专用覆盖，靠 @ActiveProfiles("test") 激活。
# profile 文件是"叠加"在 main/application.yml 之上的：只写要改的键，其余照旧。
# 目的就一个 —— 把控制台腾干净，让测试自己打印的问答成为唯一输出。

spring:
  main:
    banner-mode: off

mybatis-plus:
  configuration:
    # main 里用的是 StdOutImpl，它直接 System.out 打 SQL，日志级别管不了；
    # 测试换成完全不打日志的实现
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 测试用无头：测试本身不依赖登录态，有头会弹一堆窗口出来，没必要
browser:
  session:
    profile-headless: true

logging:
  level:
    # 连库、执行 schema.sql、Hikari 那些 INFO 一并闭嘴。
    # 别单给 com.example 开口子：Spring Boot 的 "Starting/Started 测试类" 那几行 logger 就是测试类本身，
    # 名字落在 com.example 下，一开 info 它们就冒出来了
    root: warn
    # 模型请求/响应日志是 LoggingHttpClient 里的 INFO，按包名压掉，不动生产配置里的 logRequests
    dev.langchain4j: warn
